# Local entry point: http://localhost (port 80, this server block). Proxies everything to the
# kcpc-app Compose service on its internal port 8080 - the app container itself is never published
# to the host (see docker-compose.yml "expose: 8080"), only reachable through this proxy.

# PERF: gzip compression for proxied responses (JSP-rendered HTML, JSON API responses, CSS/JS).
# gzip_proxied any is required because every response here comes from a proxy_pass upstream -
# without it nginx's default gzip_proxied (off for anything that looks proxied) would compress
# nothing. Does not touch auth/cookies/routing - purely a response-encoding transform.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml application/xml+rss text/javascript image/svg+xml
           application/vnd.ms-fontobject font/ttf font/otf application/font-woff;

server {
    listen 80;
    server_name _;

    # 10M > the app's own 5MB multipart.max-file-size/max-request-size (application.yml), so a
    # User CSV import upload is never rejected by nginx before it even reaches the app.
    client_max_body_size 10M;

    # Shared by every location below (locations do not inherit proxy_set_header from a sibling
    # location, only from server/http context) - keeping this here instead of duplicated per
    # location is what keeps the auth-forwarding headers identical everywhere.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # PERF: static asset caching. These paths are still proxied to the app (Spring serves them
    # from the classpath, nginx has no local copy to serve via try_files/alias) - the app's own
    # Spring Security header writer sends "Cache-Control: no-cache, no-store, max-age=0,
    # must-revalidate" + "Pragma: no-cache" on every response, including these, so nothing was
    # ever cacheable before this. `expires 30d` overwrites the upstream Cache-Control/Expires
    # (confirmed - it replaces, not appends); proxy_hide_header drops the leftover Pragma, which
    # `expires` does not touch. /css, /js, /webjars are already permitAll in SecurityConfig;
    # anything else matched here (e.g. /icons/**) still passes through the same proxy_pass and is
    # therefore still subject to Spring Security's normal auth check - this location changes
    # response headers only, it does not bypass authentication.
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        proxy_pass http://kcpc-app:8080;
        proxy_hide_header Pragma;
        expires 30d;
    }

    location / {
        proxy_pass http://kcpc-app:8080;
    }
}
