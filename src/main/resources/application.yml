spring:
  application:
    name: kcpc-mkt-mvp
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  web:
    resources:
      chain:
        # CACHE-BUST: content-hash cache busting for static assets. Every /css, /js and /images
        # URL rendered through <c:url> comes out as e.g. /css/app-<md5-of-file-content>.css, so a
        # deployment that changes a file changes that file's URL and the browser fetches it
        # instead of serving the 30-day cached copy (nginx.conf `expires 30d`) under the old URL.
        # Files that did NOT change keep their URL and stay cached - which is why this is a
        # content hash rather than one global ?v=<build> stamp that would re-download everything.
        # The hash is computed from the classpath content inside the WAR, so it is identical
        # however the app is built and shipped (source -> WAR -> Docker image -> GCP VM).
        # Requires the ResourceUrlEncodingFilter bean in WebMvcConfig to be in effect: without it
        # <c:url> silently emits the plain unversioned path (i.e. degrades to today's behaviour).
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/images/**
        # Resolved paths and their content hashes are memoized per file. Left OFF under the
        # default profile (local `mvn spring-boot:run`, where spring-boot-maven-plugin's
        # addResources serves src/main/resources live) so an edited CSS/JS file is still picked
        # up on a plain browser refresh with no restart; switched ON for the docker profile
        # below - local compose, dev VM and prod VM - where the files can never change while the
        # container is running, so recomputing the MD5 per request would be pure waste.
        cache: false
      cache:
        cachecontrol:
          # Mirrors the `expires 30d` nginx already sends for these paths (nginx.conf), so the
          # asset stays cacheable from the app itself if it is ever fronted by something other
          # than this nginx (e.g. a GCP HTTPS Load Balancer). Applies only to resources served by
          # the static resource handler - never to JSP pages or /api responses.
          max-age: 30d
          cache-public: true

server:
  port: 8080
  servlet:
    session:
      # Cookie-only session tracking. Without this Tomcat also honours URL-based tracking, and
      # response.encodeURL() - which JSTL's <c:url> calls under the hood - appends
      # ";jsessionid=..." to every asset href. That would make each content-hashed CSS/JS URL
      # unique per visitor and defeat caching outright, on top of putting the session id in the
      # page source. This app authenticates purely via the KCPC_AT cookie and never relies on
      # URL-based session tracking (the JSESSIONID itself only exists because a JSP page creates
      # an HttpSession by default), so restricting tracking to cookies changes no behaviour.
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
    enabled: true

# Deployment healthcheck only - /actuator/health is the sole exposed actuator endpoint, and it
# only ever reports the aggregate UP/DOWN status (never per-component details, which could leak
# datasource/internal info to an unauthenticated caller). The DB-connectivity check comes for
# free from Spring Boot's auto-configured DataSource health indicator being folded into that
# aggregate status - no custom indicator code needed.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  security:
    jwt:
      # HS512 signing secret (>=64 bytes per RFC 7518 §3.2). MUST be overridden via
      # APP_SECURITY_JWT_SECRET in every non-dev environment - this default is publicly
      # committed and therefore worthless as a secret.
      secret: ${APP_SECURITY_JWT_SECRET:7ffb418f9324372bb29aa0925c30436d0568cf34e55eaf3e75d15c930e137954bb2bd37609c98c103e0a71e197468637e6d21ad8bb942e87a5916cc956f7a3a1}
      issuer: kcpc-mkt-mvp
      access-token-ttl-minutes: ${APP_SECURITY_JWT_TTL_MINUTES:480}
      cookie-name: KCPC_AT
      cookie-path: /
      cookie-secure: true
      cookie-same-site: Lax
  csrf:
    cookie-name: KCPC_CSRF
    header-name: X-CSRF-TOKEN
  drive:
    # Google Drive per-Content-ID folder provisioning. Disabled by default everywhere this app
    # runs today (no real service-account credentials exist in this repo) - set DRIVE_ENABLED=true
    # plus the credentials/IDs below only in an environment that actually has a Google Workspace
    # service account and target Shared Drive configured. Never commit real values for any of these.
    enabled: ${DRIVE_ENABLED:false}
    service-account-key: ${DRIVE_SERVICE_ACCOUNT_KEY:}
    shared-drive-id: ${DRIVE_SHARED_DRIVE_ID:}
    root-folder-id: ${DRIVE_ROOT_FOLDER_ID:}
    impersonate-user: ${DRIVE_IMPERSONATE_USER:}

logging:
  level:
    root: INFO
    com.kcpc.mkt: INFO
    # TEMPORARY DIAGNOSTIC - Upcoming Channel Plan distinct-Content-ID rollout verification.
    # Prints "date | channel | count | uniqueContentIds" per rendered row. Remove this line (and
    # KpiDashboardService#logUpcomingChannelPlan) once the dashboard has been confirmed.
    com.kcpc.mkt.reporting.service.KpiDashboardService: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/kcpc_dev
    username: kcpc_app
    password: kcpc_app_dev_pw
  flyway:
    locations: classpath:db/migration,classpath:db/migration-demo
server:
  servlet:
    session:
      cookie:
        secure: false
app:
  security:
    jwt:
      cookie-secure: false
logging:
  level:
    com.kcpc.mkt: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5432/kcpc_test
    username: kcpc_app
    password: kcpc_app_dev_pw
  flyway:
    clean-disabled: false
server:
  servlet:
    session:
      cookie:
        secure: false
app:
  security:
    jwt:
      cookie-secure: false
      secret: 2c3d0ca4fc87c91d0d09eae17527a4e443de605dffbde5bc1ae51645ccc8dcd6214afe526e5b05df097d549b0777d3610656269e23933bfcdf122d5b385bdda1

---
spring:
  config:
    activate:
      on-profile: docker
  # DB-001: runtime datasource (JPA/Hikari, every request-serving query) connects as the
  # restricted kcpc_app role - no UPDATE/DELETE/TRUNCATE on append-only tables (enforced both by
  # Postgres GRANTs and by DB trigger; see V13__db_privilege_split_and_truncate_guards.sql).
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:kcpc_prod}
    username: ${DB_USER:kcpc_app}
    password: ${DB_PASSWORD:}
  # Flyway runs schema DDL as the schema-owning kcpc_migrator role - a separate, higher-privilege
  # connection used only at startup, never by request-serving code.
  flyway:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:kcpc_prod}
    user: ${FLYWAY_DB_USER:kcpc_migrator}
    password: ${FLYWAY_DB_PASSWORD:}
# NOT overriding spring.flyway.locations here - inherits the base profile's
# "classpath:db/migration" unchanged. db/migration-demo is only ever added under the dev profile
# below; this is asserted by DockerFlywayProfileConfigurationTest.
server:
  # nginx (deploy/prod/nginx.conf) already sends X-Forwarded-Proto/-Host/-For on every proxied
  # request, but without this, Tomcat has no reason to trust or read them - it sees only the
  # plain-HTTP connection from the nginx container on :8080, so response.sendRedirect() with a
  # relative path (e.g. MvcAuthEntryPoint's redirect to "/login") builds its Location header as
  # http://<host>/login even when the real client request was https://. That mismatched scheme is
  # exactly why an unauthenticated https://content.vedtri.com/ redirect could fail/error instead
  # of reaching https://content.vedtri.com/login: the browser was being sent to plain HTTP.
  # RemoteIpValve (the "native" strategy, Tomcat's own request-scheme/host resolution, applied
  # before any servlet filter runs) makes request.getScheme()/isSecure()/getServerName() reflect
  # the ORIGINAL client-facing request nginx forwarded - every relative sendRedirect() in the app
  # (MvcAuthEntryPoint included) then correctly emits https://. This has no effect locally (dev/
  # test have no reverse proxy in front, so these headers are never present) - scoped to the
  # docker profile only, the one deployment shape that actually sits behind nginx.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # See docker-compose.yml's COOKIE_SECURE comment: false by default because this compose
        # stack terminates plain HTTP locally; set true once real HTTPS terminates in front of it.
        secure: ${COOKIE_SECURE:false}
app:
  security:
    jwt:
      cookie-secure: ${COOKIE_SECURE:false}

---
# Docker profile - the profile every containerised environment runs under (local docker-compose,
# deploy/dev, deploy/prod). See the spring.web.resources.chain.cache comment above for why the
# resolver cache is enabled here but not for local `mvn spring-boot:run`.
spring:
  config:
    activate:
      on-profile: docker
  web:
    resources:
      chain:
        cache: true
